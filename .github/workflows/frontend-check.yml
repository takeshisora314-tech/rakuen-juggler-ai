name: frontend checks
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - morning_window.py
      - test_morning_window.py
      - forecast_engine.py
      - test_forecast_engine.py
      - rank_comparison.py
      - test_rank_comparison.py
      - external_morning_trigger.mjs
      - test_external_morning_trigger.mjs
      - wrangler.jsonc
      - track_count_predictions.py
      - test_count_tracking.py
      - check_publication.py
      - test_publication.py
      - grape_estimator.js
      - review_grape_conditions.cjs
      - .github/workflows/collect-test.yml
      - test_*frontend.cjs
      - test_grape_estimator.cjs
      - .github/workflows/frontend-check.yml
permissions:
  contents: read
jobs:
  external-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test_external_morning_trigger.mjs
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test display and grape calculations
        run: |
          node test_frontend.cjs
          node test_refresh_frontend.cjs
          node test_research_frontend.cjs
          node test_answer_frontend.cjs
          node test_grape_estimator.cjs
          node test_grape_frontend.cjs
  publication-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests==2.34.2
      - run: python -m unittest test_publication test_forecast_engine test_count_tracking test_rank_comparison test_morning_window -v
