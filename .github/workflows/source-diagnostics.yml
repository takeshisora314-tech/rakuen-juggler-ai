name: Diagnose source access
on:
  workflow_dispatch:
  push:
    paths:
      - diagnose_sources.py
      - test_source_diagnostics.py
      - .github/workflows/source-diagnostics.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install requests==2.34.2
      - name: Test diagnostic classification and data minimization
        run: python -m unittest test_source_diagnostics -v
      - name: Inspect one response per source
        run: python diagnose_sources.py
