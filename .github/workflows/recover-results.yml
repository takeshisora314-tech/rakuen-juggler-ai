name: recover results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recover-results.yml]
permissions:
  contents: read
concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify collector and evaluation
        run: |
          python -m unittest test_machine_collector test_collection_runner test_forecast_engine test_answer_status test_count_tracking -v
          node test_frontend.cjs
          node test_research_frontend.cjs
          node test_answer_frontend.cjs
          node test_grape_estimator.cjs
          node test_grape_frontend.cjs
      - name: Install Chromium
        timeout-minutes: 2
        run: python -m playwright install chromium --only-shell
      - name: Collect Min-repo results
        timeout-minutes: 5
        run: python run_collection.py
      - name: Evaluate preserved morning forecasts
        run: |
          python forecast_engine.py
          python check_answers.py
          python track_count_predictions.py
      - name: Save recovered results and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history answer_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Recover machine results and settle preserved forecasts"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Report actual recovery status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data.json').read_text())
          status = json.loads(Path('answer_status.json').read_text())
          print(json.dumps({'collection': data.get('machine_collection'), 'answer':status},ensure_ascii=False))
          if status['status'] != 'complete':
              raise SystemExit('Results remain incomplete; inspect saved collection evidence')
          PY
