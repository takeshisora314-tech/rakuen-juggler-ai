name: collect data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
    - cron: "17 21 * * *"
    - cron: "30 14 * * *"
    - cron: "45 21 * * *"
    - cron: "5 22 * * *"

permissions:
  contents: read

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'schedule' || (github.event.schedule != '45 21 * * *' && github.event.schedule != '5 22 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        timeout-minutes: 2
        run: python -m playwright install chromium --only-shell

      - name: Test layout and preservation
        run: |
          python -m unittest discover -s tests -v
          python -m unittest test_machine_collector -v
          python -m unittest test_forecast_engine -v
          python -m unittest test_historical_layout test_setting_sensitivity test_evaluate_history test_answer_status -v
          python -m unittest test_evaluate_candidates test_strategy_comparison test_setting_prediction test_count_models test_count_tracking -v
          python -m unittest test_publication -v
          python -m unittest test_collection_runner -v
          node test_frontend.cjs
          node test_research_frontend.cjs
          node test_answer_frontend.cjs
          node --test test_external_morning_trigger.mjs

      - name: Check source availability
        run: python collect_sources.py

      - name: Collect machine results
        timeout-minutes: 5
        continue-on-error: true
        run: python run_collection.py

      - name: Generate immutable forecast and evaluate
        run: python forecast_engine.py

      - name: Record explicit answer-check status
        continue-on-error: true
        run: python check_answers.py

      - name: Refresh historical evaluation report
        continue-on-error: true
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess
          import sys
          day = str(datetime.now(ZoneInfo('Asia/Tokyo')).date())
          subprocess.run([sys.executable, 'evaluate_history.py', '--as-of', day,
                          '--output', 'evaluation_report.json'], check=True)
          PY

      - name: Refresh paired strategies and missing-data audit
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess
          import sys
          day = str(datetime.now(ZoneInfo('Asia/Tokyo')).date())
          subprocess.run([sys.executable, 'evaluate_strategies.py', '--as-of', day], check=True)
          PY

      - name: Save collected status and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history evaluation_report.json answer_status.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update source checks and dated layout"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Freeze and evaluate research count predictions
        timeout-minutes: 2
        continue-on-error: true
        run: |
          mkdir -p history/count-predictions history/count-evaluations
          python track_count_predictions.py
          git add history/count-predictions history/count-evaluations
          if ! git diff --cached --quiet; then
            git commit -m "Save frozen research count predictions and evaluations"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Refresh offline count-model comparison
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess
          import sys
          day = str(datetime.now(ZoneInfo('Asia/Tokyo')).date())
          subprocess.run([sys.executable, 'evaluate_count_models.py', '--as-of', day], check=True)
          subprocess.run(['git', 'add', 'history/research/count-model-comparison-' + day + '.json'], check=True)
          changed = subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode
          if changed == 1:
              subprocess.run(['git', 'commit', '-m', 'Update offline count-model comparison'], check=True)
              subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          elif changed != 0:
              raise RuntimeError('Unable to check research changes')
          PY

  publication:
    needs: collect
    if: always() && !cancelled() && github.event.schedule != '30 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitoring dependency
        run: python -m pip install requests==2.34.2
      - name: Test public observation rules
        run: python -m unittest test_publication -v
      - name: Observe the public forecast
        run: python check_publication.py
      - name: Save publication evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication_status.json history/publication-checks
          git commit -m "Record public forecast availability"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Flag missing or invalid forecast after deadline
        run: |
          python -c "import json; s=json.load(open('publication_status.json')); print(s['status'], s['deadline_status']); raise SystemExit(1 if s['require_attention'] else 0)"


