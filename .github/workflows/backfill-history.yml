name: backfill history
on:
  workflow_dispatch:
  schedule:
    - cron: "35 0,3,6,9,12,15,18 * * *"
permissions:
  contents: read
concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install chromium --only-shell
        timeout-minutes: 2
      - name: Test preservation and resume rules
        run: python -m unittest test_machine_collector test_collection_runner -v
      # 2026-10-28: reuse setup for two sequential, saved two-day batches.
      # Next: measure yield/duration; do not increase concurrency or bypass blocks.
      - name: Backfill up to four historical report days in saved batches
        timeout-minutes: 9
        run: |
          python - <<'PY'
          import time
          from run_collection import run
          for batch in range(2):
              evidence = run(backfill_only=True)
              result = evidence['result']
              outcomes = result.get('backfill', {}).values()
              progressed = any(item.get('status') in ('complete', 'partial') for item in outcomes)
              if evidence['process_failed'] or result.get('status') in ('blocked', 'error') or not progressed:
                  break
              if batch == 0:
                  time.sleep(10)
          PY
      - name: Save historical results without regenerating forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history
          if ! git diff --cached --quiet; then
            git commit -m "Backfill historical machine results"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
