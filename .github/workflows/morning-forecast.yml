name: morning forecast retry

on:
  workflow_dispatch:
  schedule:
    - cron: "15,45 20 * * *"
    - cron: "15,35 21 * * *"

permissions:
  contents: read

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests==2.34.2
      - name: Test forecast timing and immutability
        run: python -m unittest test_forecast_engine -q
      - name: Retry with saved data only inside the morning window
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from forecast_engine import run
          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          if 5 <= now.hour < 7:
              run(now=now)
          else:
              print(f'Skipped outside 05:00-06:59 JST: {now.isoformat()}')
          PY
      - name: Save without changing an existing forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history
          if ! git diff --cached --quiet; then
            git commit -m "Retry morning forecast from saved results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
