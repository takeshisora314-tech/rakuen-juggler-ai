name: collect data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        timeout-minutes: 2
        run: python -m playwright install chromium --only-shell

      - name: Test layout and preservation
        run: |
          python -m unittest discover -s tests -v
          python -m unittest test_machine_collector -v

      - name: Run collector
        run: |
          python collect_sources.py
          python collect_machines.py

      - name: Save collected status and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update source checks and dated layout"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
