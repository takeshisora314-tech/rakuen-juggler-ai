name: backfill history
on:
  workflow_dispatch:
  schedule:
    - cron: "35 0,3,6,9,12,15,18 * * *"
permissions:
  contents: read
concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install chromium --only-shell
        timeout-minutes: 2
      - name: Test preservation and resume rules
        run: python -m unittest test_machine_collector test_collection_runner -v
      - name: Backfill at most two historical report days
        run: python run_collection.py --backfill-only
        timeout-minutes: 5
      - name: Save historical results without regenerating forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history
          if ! git diff --cached --quiet; then
            git commit -m "Backfill historical machine results"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
