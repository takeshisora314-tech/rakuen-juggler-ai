name: morning forecast retry

on:
  workflow_dispatch:
  schedule:
    - cron: "15,45 20 * * *"
    - cron: "15,35 21 * * *"
    - cron: "15,45 22 * * *"
    - cron: "5,25 23 * * *"

permissions:
  contents: read

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests==2.34.2
      - name: Test forecast timing and immutability
        run: python -m unittest test_forecast_engine test_count_tracking -q
      - name: Retry with saved data only inside the morning window
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from forecast_engine import run
          from morning_window import in_morning_window
          from track_count_predictions import run as track_counts
          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          if in_morning_window(now):
              run(now=now)
              track_counts(now=now)
          else:
              print(f'Skipped outside dated morning window (from Nov 4: 05:00-08:29 JST): {now.isoformat()}')
          PY
      - name: Save without changing an existing forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history
          if ! git diff --cached --quiet; then
            git commit -m "Retry morning forecast from saved results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
