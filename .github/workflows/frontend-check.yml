name: frontend checks
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - grape_estimator.js
      - test_*frontend.cjs
      - test_grape_estimator.cjs
      - .github/workflows/frontend-check.yml
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test display and grape calculations
        run: |
          node test_frontend.cjs
          node test_research_frontend.cjs
          node test_answer_frontend.cjs
          node test_grape_estimator.cjs
          node test_grape_frontend.cjs
