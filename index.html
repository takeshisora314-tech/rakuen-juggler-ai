<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>楽園上新屋 ジャグラーAI</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#111827;color:#fff;padding:18px 14px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:20px}.sub{font-size:12px;opacity:.8;margin-top:4px}
.tabs{display:flex;gap:7px;overflow:auto;background:#fff;padding:9px;position:sticky;top:78px;z-index:4}button{border:0;border-radius:18px;padding:8px 11px;font-weight:700;white-space:nowrap;cursor:pointer}.on{background:#111827;color:#fff}button:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
.row{display:flex;align-items:center;gap:7px;padding:11px 0;border-bottom:1px solid #eee}.no{width:60px;font-size:17px;font-weight:900}.badge{margin-left:auto;font-size:11px;padding:5px 7px;border-radius:8px;background:#eef2ff}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:11px;font-size:12px;line-height:1.65;margin-bottom:12px}.small{font-size:12px;color:#4b5563;line-height:1.65}input{max-width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;font:inherit}h2{font-size:19px}h3{font-size:15px;margin-top:0}a{color:#1d4ed8}.date-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1>🎰 楽園上新屋 ジャグラーAI</h1><div class="sub">実験予想・自動答え合わせ・公開実績</div></header>
<nav id="tabs" class="tabs" aria-label="機種選択"></nav>
<main>
<section class="card">
  <label for="layout-date">台割の基準日（日本時間）</label>
  <div class="date-controls"><input id="layout-date" type="date"><button id="today" type="button">今日</button></div>
  <p id="layout-note" class="small"></p>
</section>
<div class="note">2026/10/27から：マイジャグ6は2201〜2220（20台）、マイジャグ5は2221〜2239（19台）。入替前の5と導入後の6は別の機種履歴として扱います。</div>
<section class="card" id="forecast-panel" aria-live="polite"></section>
<section class="card" id="evaluation-panel" aria-live="polite"></section>
<div id="app" aria-live="polite"><div class="card">台割を読み込んでいます。</div></div>
<section class="card" id="source-status" aria-live="polite"></section>
<div class="note"><b>表示について</b><br>実験予想は固定ルールによる参考候補で、精度未検証です。点数は優先度であり勝率ではありません。設定そのものや設定変更は確認できません。台別実績はみんレポの独自集計による参考値です。差枚は実際の収支・期待利益を示さず、勝利を保証しません。未取得は0で補いません。</div>
</main>
<script>
let CONFIG = null, DATA = null, current = null, followToday = true, selectedResultDay = null;
const dateInput = document.getElementById('layout-date');
function todayJST(now = new Date()) {
  return new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
}
function activeModels(config, day) {
  return config.models.flatMap(model => model.installations
    .filter(p => (!p.from || day >= p.from) && (!p.until || day < p.until))
    .map(p => ({...model, numbers:p.numbers, validFrom:p.from, validUntil:p.until})));
}
function safe(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function latestModelRecords(model, day) {
  const records = (DATA?.machine_records || []).filter(r => r.model_id === model.id && r.date <= day);
  const latest = records.reduce((d, r) => r.date > d ? r.date : d, '');
  const selected = records.some(r => r.date === selectedResultDay) ? selectedResultDay : latest;
  return new Map(records.filter(r => r.date === selected).map(r => [r.number, r]));
}
function recentDipSummary(model, targetDay) {
  const cutoff = new Date(targetDay + 'T00:00:00Z'); cutoff.setUTCDate(cutoff.getUTCDate() - 7);
  const rows = (DATA?.machine_records || []).filter(r => r.model_id === model.id && r.date < targetDay && r.date >= cutoff.toISOString().slice(0,10));
  const days = [...new Set(rows.map(r => r.date))].sort().reverse().slice(0,3);
  if (days.length < 3) return '<p class="small">直近3取得日の比較：履歴不足のため集計しません。新機種に旧機種の実績は流用しません。</p>';
  const items = model.numbers.flatMap(number => {
    const history = days.map(day => rows.find(r => r.date === day && r.number === number));
    if (history.some(r => !r || !Number.isInteger(r.difference) || !Number.isInteger(r.games) || r.games < 3000)) return [];
    return [{number, total:history.reduce((sum,r)=>sum+r.difference,0)}];
  }).filter(r=>r.total<0).sort((a,b)=>a.total-b.total || a.number-b.number).slice(0,3);
  return `<section class="note"><b>直近3取得日の凹み集計（予想ではありません）</b><br>${safe(days.slice().reverse().join('・'))}<br>各日3,000G以上の台で、差枚合計が低い順です。負けた台が次に出ることや、設定が上がることを意味しません。${items.length ? items.map(r=>`<div>${r.number}番：3日合計 ${r.total.toLocaleString('ja-JP')}枚</div>`).join('') : '<div>条件に合う台はありません。</div>'}</section>`;
}
function machineRow(number, record) {
  if (!record) return `<div class="row"><div class="no">${number}</div><span class="badge">台別データ未取得</span></div>`;
  const value = key => Number.isInteger(record[key]) ? record[key].toLocaleString('ja-JP') : '未取得';
  let source = '';
  try { const url = new URL(record.source_url); if (url.protocol === 'https:' && url.hostname === 'min-repo.com') source = `<a href="${safe(url.href)}" target="_blank" rel="noopener noreferrer">出典：みんレポ</a>`; } catch (_) {}
  return `<div class="row"><div class="no">${number}</div><div class="small">実績日 ${safe(record.date)}<br>G ${value('games')} ／ BB ${value('bb')} ／ RB ${value('rb')}<br>差枚 ${value('difference')}枚 · ${source}</div></div>`;
}
function drawForecast(model) {
  const panel = document.getElementById('forecast-panel');
  const evaluationPanel = document.getElementById('evaluation-panel');
  const forecast = DATA?.forecast;
  if (!model || !forecast) {
    panel.innerHTML = '<h3>実験予想</h3><p class="small">初回の自動生成待ちです。</p>';
    evaluationPanel.innerHTML = '';
    return;
  }
  const labels = {balanced:'バランス型', dip:'凹み重視型', rb:'RB実績重視型'};
  const item = forecast.models?.[model.id];
  const reasons = {insufficient_history:'履歴が3日未満のため予想しません。', stale_data:'直近実績が古いため予想しません。', insufficient_eligible_machines:'回転数・欠損条件を満たす台が不足しています。'};
  const state = forecast.display_status === 'locked' ? '事前保存済み（変更しません）' : '仮表示（朝の収集後に事前保存）';
  let html = `<h3>実験予想：${safe(forecast.date)} · ${safe(model.name)}</h3><p class="small">${safe(state)}<br>上の台割・実績日選択とは独立した、最新の予想です。未検証の参考候補で、設定上げの確率・勝率ではありません。</p>`;
  if (!item || item.status !== 'ready') html += `<p>${safe(reasons[item?.status] || 'この予想日の対象機種ではありません。')}</p>`;
  else {
    const selection = item.selection;
    const candidates = item.strategies?.[selection.strategy] || [];
    html += `<p class="small">最終実績：${safe(item.latest_source_date)}／履歴${safe(item.history_days)}日<br>方式：${safe(labels[selection.strategy] || selection.strategy)} · 事前比較${safe(selection.paired_days)}日（切替判定は30日以上）</p>`;
    html += candidates.map((r,i)=>`<div class="row"><div class="no">${i+1}. ${safe(r.number)}</div><div class="small">優先度 ${safe(r.score)}点（確率ではありません）<br>直近3有効日：${safe(r.three_day_difference)}枚／履歴${safe(r.history_days)}日・${safe(r.history_games)}G<br>履歴RB：${r.rb_denominator ? '1/'+safe(r.rb_denominator) : '回数0'}／最終日 ${safe(r.latest_games)}G・${safe(r.latest_difference)}枚</div></div>`).join('');
  }
  html += '<details class="small"><summary>予想と改善のルール</summary><p>直近14暦日内・最大7取得日を使い、各日3,000G以上の履歴が3日以上、合計12,000G以上の台を対象にします。直近実績が2日超古い場合は見送ります。凹み、RB実績、回転数を固定の重みで比較する実験ルールで、学習済みAIではありません。</p><p>朝5時に収集後、9時前なら当日予想を一度だけ保存。23時に実績公開分を答え合わせし、未公開なら翌朝に再確認します。実行遅延があり得ます。切替は事前保存された3方式の同条件比較が30日以上そろい、平均の相対差枚が100枚以上改善し、プラス台率が悪化しない場合だけです。精度向上を保証しません。</p></details>';
  panel.innerHTML = html;
  const actual = (DATA?.evaluation?.prospective || []).filter(e=>e.models?.[model.id]?.status==='complete');
  const pending = (DATA?.evaluation?.prospective || []).filter(e=>e.models?.[model.id]?.status==='pending_results');
  const replay = (DATA?.evaluation?.retrospective || []).filter(e=>e.models?.[model.id]?.status==='complete');
  let evaluationHTML = `<h3>自動答え合わせ · ${safe(model.name)}</h3><p class="small">事前保存分：評価完了${actual.length}日／公開待ち${pending.length}日。実際の設定は不明なので、公開差枚・BB・RB等で成績を記録します。</p>`;
  for (const e of actual.slice(-5).reverse()) {
    const result = e.models[model.id]; const s = result.strategies[result.selected_strategy];
    evaluationHTML += `<p class="small">${safe(e.date)}：プラス${safe(s.positive_count)}/${safe(s.count)}台 · 平均差枚${safe(s.mean_difference)}枚 · 同条件全台平均との差${safe(s.lift_vs_eligible_mean)}枚（3,000G未満${safe(s.low_play_count)}台）</p>`;
  }
  if (!actual.length) evaluationHTML += '<p class="small">まだ事前予想の評価実績はありません。仮表示や過去再計算を、的中実績として数えません。</p>';
  evaluationHTML += `<details class="small"><summary>過去再計算 ${replay.length}日（事前予想ではありません）</summary><p>各対象日より前のデータだけで再計算した参考結果です。方式の自動切替には使いません。少数の結果から将来の精度は判断できません。</p>`;
  for (const e of replay) {
    const s=e.models[model.id].strategies.balanced;
    evaluationHTML += `<p>${safe(e.date)}：プラス${safe(s.positive_count)}/${safe(s.count)}台 · 平均差枚${safe(s.mean_difference)}枚 · 同条件全台平均との差${safe(s.lift_vs_eligible_mean)}枚</p>`;
  }
  evaluationPanel.innerHTML = evaluationHTML + '</details>';
}
function draw() {
  if (!CONFIG || !/^\d{4}-\d{2}-\d{2}$/.test(dateInput.value)) return;
  const models = activeModels(CONFIG, dateInput.value);
  if (!models.some(m => m.id === current)) current = models[0]?.id;
  const tabs = document.getElementById('tabs');
  tabs.replaceChildren();
  for (const model of models) {
    const button = document.createElement('button');
    button.type = 'button'; button.textContent = model.name;
    button.className = model.id === current ? 'on' : '';
    button.setAttribute('aria-pressed', String(model.id === current));
    button.addEventListener('click', () => {current = model.id; selectedResultDay = null; draw();});
    tabs.appendChild(button);
  }
  const model = models.find(m => m.id === current);
  drawForecast(model);
  const records = model ? latestModelRecords(model, dateInput.value) : new Map();
  const resultDays = model ? [...new Set((DATA?.machine_records || []).filter(r=>r.model_id===model.id && r.date<=dateInput.value).map(r=>r.date))].sort().reverse() : [];
  const resultDay = records.values().next().value?.date;
  document.getElementById('layout-note').textContent = dateInput.value === todayJST()
    ? '今日の台割です。日付を変えると、入替前・入替後の台番を確認できます。'
    : '選択日の台割プレビューです。当日の実績・予想ではありません。';
  document.getElementById('app').innerHTML = model
    ? `<section class="card"><h2>${safe(model.name)}</h2><p class="small">${model.numbers.length}台・台番順（予想順位ではありません）<br>選択日以前の取得実績を表示。当日のライブデータではありません。${model.id === 'myj6' ? '<br>導入日：2026/10/27。旧マイジャグ5の実績を6の実績として引き継ぎません。' : ''}</p>${resultDays.length ? `<label class="small" for="result-day">実績日（${resultDays.length}日分）</label> <select id="result-day" style="font:inherit;padding:8px;max-width:100%">${resultDays.map(day=>`<option value="${safe(day)}" ${day===resultDay?'selected':''}>${safe(day)}</option>`).join('')}</select>` : ''}<p class="small">以下の集計は台割の基準日より前のデータを使用し、実績日の選択とは独立しています。</p>${recentDipSummary(model,dateInput.value)}${model.numbers.map(n => machineRow(n, records.get(n))).join('')}</section>`
    : '<div class="card">この日の台割は登録されていません。</div>';
  document.getElementById('result-day')?.addEventListener('change', event=>{selectedResultDay=event.target.value;draw();});
}
function drawSources() {
  let html = '<h3>データ元の接続確認（台別取得とは別）</h3>';
  const collection = DATA?.machine_collection;
  if (collection) {
    const statuses = {complete:'全対象機種を取得', partial:'一部機種のみ取得', blocked:'アクセス制限で停止', error:'取得エラー'};
    html += `<p class="small">台別収集：${safe(statuses[collection.status] || '状態不明')}<br>対象実績日：${safe(collection.report_date || '未確認')}<br>最終試行：${safe(collection.attempted_at || '不明')}</p>`;
    for (const [id, result] of Object.entries(collection.models || {})) {
      const name = CONFIG?.models.find(m => m.id === id)?.name || id;
      html += `<p class="small">${safe(name)}：${result.status === 'complete' ? safe(result.rows) + '台取得' : '未取得（台割不一致・未公開・取得エラー等）'}</p>`;
    }
    const backfill = Object.entries(collection.backfill || {});
    if (backfill.length) html += `<p class="small">マイジャグ5の過去補完：${backfill.filter(([,r])=>['complete','cached'].includes(r.status)).length}日成功／${backfill.length}日試行。ほかの機種は日次収集で蓄積します。</p>`;
  }
  if (!DATA?.updated_at) html += '<p class="small">確認結果はまだ読み込めていません。</p>';
  else {
    const updated = new Date(DATA.updated_at);
    const label = Number.isNaN(updated.getTime()) ? '日時不明' : updated.toLocaleString('ja-JP', {timeZone:'Asia/Tokyo'});
    html += `<p class="small">最終確認：${safe(label)}（日本時間）</p>`;
    for (const [name, source] of Object.entries(DATA.sources || {})) {
      html += `<div class="row"><span>${safe(name)}</span><span class="badge">${source.ok ? '接続可' : '取得不可'}${source.status ? ' HTTP ' + safe(source.status) : ''}</span></div>`;
    }
  }
  document.getElementById('source-status').innerHTML = html;
}
async function fetchJSON(path) {
  const response = await fetch(path, {cache:'no-store'});
  if (!response.ok) throw new Error('読み込み失敗');
  return response.json();
}
async function load() {
  dateInput.value = todayJST();
  try {
    CONFIG = await fetchJSON('machines.json');
    if (!Array.isArray(CONFIG.models)) throw new Error('台割の形式が不正です');
    draw();
  } catch (error) {
    document.getElementById('app').innerHTML = '<div class="card">台割を読み込めませんでした。時間をおいて再読み込みしてください。</div>';
  }
  try { DATA = await fetchJSON('data.json'); } catch (error) { DATA = null; }
  draw(); drawSources();
}
dateInput.addEventListener('change', () => {followToday = false; draw();});
document.getElementById('today').addEventListener('click', () => {followToday = true; dateInput.value = todayJST(); draw();});
setInterval(() => {
  if (followToday && dateInput.value !== todayJST()) {dateInput.value = todayJST(); draw();}
}, 60000);
load();
</script>
</body>
</html>
