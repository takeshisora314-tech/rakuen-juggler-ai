name: backfill history
on:
  workflow_dispatch:
    inputs:
      batches:
        description: "Sequential two-day batches (scheduled runs always use 2)"
        type: choice
        default: "2"
        options: ["2", "4", "6"]
  schedule:
    - cron: "35 0,3,6,9,12,15,18 * * *"
permissions:
  contents: read
concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install chromium --only-shell
        timeout-minutes: 2
      - name: Test preservation and resume rules
        run: python -m unittest test_machine_collector test_collection_runner test_backfill_batches -v
      - name: Backfill bounded history batches and commit each batch
        timeout-minutes: 26
        env:
          BATCH_LIMIT: ${{ inputs.batches || '2' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from backfill_batches import run_batches
          def git(*args):
              return subprocess.run(['git',*args],check=True)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          def save():
              git('add','data.json','history')
              changed=subprocess.run(['git','diff','--cached','--quiet']).returncode
              if changed not in (0,1):
                  raise RuntimeError('Cannot inspect staged changes')
              if changed:
                  git('commit','-m','Backfill historical machine results')
                  git('pull','--rebase','origin',os.environ['GITHUB_REF_NAME'])
                  git('push','origin','HEAD:'+os.environ['GITHUB_REF_NAME'])
          run_batches(limit=int(os.environ['BATCH_LIMIT']),save=save)
          PY
